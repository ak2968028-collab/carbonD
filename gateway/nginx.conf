# Single public entry point behind the Cloudflare tunnel:
#   /geoserver/...  -> GeoServer, map services only (WMS/WFS/WCS/OWS/GWC)
#   everything else -> backend (FastAPI: /api, /docs, /openapi.json)
# GeoServer's admin UI and REST API are NOT exposed here; use http://localhost:<GEOSERVER_PORT> locally.

# Docker DNS, re-resolved so recreated containers (new IPs) keep working
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    client_max_body_size 50m;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    set $backend   backend:7200;
    set $geoserver geoserver:8080;

    # e.g. /geoserver/dashboard/wms, /geoserver/ows, /geoserver/gwc/service/wmts
    location ~ ^/geoserver/([A-Za-z0-9_-]+/)?(wms|wfs|wcs|ows|gwc)(/|$) {
        proxy_pass http://$geoserver;
    }

    location /geoserver/ {
        return 403 "GeoServer admin is not available publicly\n";
    }

    location / {
        proxy_pass http://$backend;
    }
}
